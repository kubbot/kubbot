<text x="96" y="283" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b0c1da" text-anchor="start">Docs + repository</text>
<path d="M 376 249 H 422" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="314" width="320" height="90" rx="16" fill="#1d3150"/>
<rect x="76" y="338" width="4" height="42" rx="2" fill="#89ded5"/>
<text x="96" y="358" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f2f6ff" text-anchor="start">Skills</text>
<text x="96" y="393" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b0c1da" text-anchor="start">Reusable methods</text>
<path d="M 376 359 H 422" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="424" width="320" height="90" rx="16" fill="#1d3150"/>
<rect x="76" y="448" width="4" height="42" rx="2" fill="#89ded5"/>
<text x="96" y="468" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f2f6ff" text-anchor="start">Memory</text>
<text x="96" y="503" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b0c1da" text-anchor="start">Reviewed lessons</text>
<path d="M 376 469 H 422" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 422 249 V 469 M 422 378 H 467" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="472" y="204" width="672" height="72" rx="16" fill="#294263"/>
<text x="496" y="250" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#89ded5" text-anchor="start">MCP</text>
<text x="580" y="250" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#b0c1da" text-anchor="start">Connected tools to read, build and check</text>
<path d="M 600 276 V 305" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="472" y="310" width="256" height="136" rx="16" fill="#294263"/>
<text x="500" y="363" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#f2f6ff" text-anchor="start">Agent</text>
<text x="500" y="407" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b0c1da" text-anchor="start">Execute with context</text>
