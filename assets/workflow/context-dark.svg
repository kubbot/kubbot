<rect x="824" y="323" width="320" height="110" rx="16" fill="#1d3150"/>
<rect x="844" y="347" width="4" height="62" rx="2" fill="#f1c59f"/>
<text x="864" y="367" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#f2f6ff" text-anchor="start">Verified work</text>
<text x="864" y="402" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b0c1da" text-anchor="start">Code + review + evidence</text>
<path d="M 984 433 V 594 H 216 V 520" fill="none" stroke="#647e9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 7"/>
<rect x="390" y="569" width="548" height="49" rx="8" fill="#14233b"/>
<text x="664" y="601" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#b0c1da" text-anchor="middle">Review outcomes. Keep what holds up.</text>
<path d="M 56 648 H 1144" fill="none" stroke="#647e9f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="682" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0c1da" text-anchor="start">Skills define the method. Tools act. Memory keeps reviewed lessons.</text>
</svg>
