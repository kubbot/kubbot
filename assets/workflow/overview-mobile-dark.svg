<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1020" viewBox="0 0 640 1020" role="img" aria-labelledby="title description">
<title id="title">kubbot: intent becomes working software</title>
<desc id="description">Intent and relevant context feed agent execution. Connected tools support the work, and delivery includes a change and its evidence.</desc>
