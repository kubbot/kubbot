<text x="56" y="224" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="54" font-weight="650" fill="#f2f6ff" text-anchor="start">working software.</text>
<text x="56" y="284" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#b0c1da" text-anchor="start">A connected workflow,</text>
<text x="56" y="323" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#b0c1da" text-anchor="start">from a clear goal to reviewed work.</text>
