<text x="584" y="73" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0c1da" text-anchor="end">AI workflow</text>
